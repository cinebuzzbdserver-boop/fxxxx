name: Build Plugins to FLX Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Compiler & Dependencies
        run: |
          curl -sLo jsoup.jar https://repo1.maven.org/maven2/org/jsoup/jsoup/1.17.2/jsoup-1.17.2.jar
          curl -sLo coroutines.jar https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.0/kotlinx-coroutines-core-jvm-1.8.0.jar
          curl -sLo kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -qo kotlinc.zip

      - name: Build Plugins to FLX
        run: |
          ANDROID_JAR=$(ls -1 /usr/local/lib/android/sdk/platforms/android-*/android.jar | tail -n 1)
          D8_TOOL=$(ls -1 /usr/local/lib/android/sdk/build-tools/*/d8 | tail -n 1)
          STDLIB_JAR="$(pwd)/kotlinc/lib/kotlin-stdlib.jar"

          mkdir -p src/com/flixora/plugin
          cat << 'EOF' > src/com/flixora/plugin/MainAPI.kt
          package com.flixora.plugin

          data class MovieItem(
              val title: String,
              val image: String,
              val url: String,
              val imageSize: String
          )

          data class StreamItem(
              val quality: String,
              val streamUrl: String
          )

          data class EpisodeItem(
              val name: String,
              val rawGenerateLinks: List<Pair<String, String>>
          )

          data class SeasonItem(
              val name: String,
              val episodes: List<EpisodeItem>
          )

          data class MediaStructure(
              val isSeries: Boolean,
              val rawMovieLinks: List<Pair<String, String>>,
              val seasons: List<SeasonItem>
          )

          abstract class MainAPI {
              abstract var name: String
              abstract var mainUrl: String
              abstract suspend fun getMainPage(page: Int): List<MovieItem>
              abstract suspend fun search(query: String, page: Int = 1): List<MovieItem>
              abstract suspend fun loadLinks(postUrl: String): List<StreamItem>
              open suspend fun loadMediaStructure(postUrl: String): MediaStructure {
                  return MediaStructure(isSeries = false, rawMovieLinks = emptyList(), seasons = emptyList())
              }
              open suspend fun resolveDirectLink(generateUrl: String): String? {
                  return null
              }
          }
          EOF

          for file in plugins/*.kt; do
            if [ -f "$file" ]; then
              baseName=$(basename "$file" .kt)
              outputName=$(echo "$baseName" | sed 's/Provider$//')

              ./kotlinc/bin/kotlinc "$file" src/com/flixora/plugin/MainAPI.kt \
                -cp "jsoup.jar:coroutines.jar:$ANDROID_JAR" \
                -d "${outputName}_temp.jar"

              mkdir -p "dex_out_${outputName}"
              $D8_TOOL --release --min-api 21 \
                --lib "$ANDROID_JAR" \
                --lib "$STDLIB_JAR" \
                --lib jsoup.jar \
                --lib coroutines.jar \
                --output "dex_out_${outputName}" \
                "${outputName}_temp.jar"

              if [ -f "dex_out_${outputName}/classes.dex" ]; then
                mv "dex_out_${outputName}/classes.dex" "${outputName}.flx"
              fi
              rm -rf "dex_out_${outputName}" "${outputName}_temp.jar"
            fi
          done

          rm -rf src kotlinc kotlinc.zip jsoup.jar coroutines.jar

      - name: Commit and Push FLX Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.flx || true
          git diff --staged --quiet || (git commit -m "Auto-compiled plugins to .flx binaries" && git push)
