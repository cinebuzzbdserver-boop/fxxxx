name: Build Plugins to FLX Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Compiler & Jsoup
        run: |
          curl -sLo jsoup.jar https://repo1.maven.org/maven2/org/jsoup/jsoup/1.17.2/jsoup-1.17.2.jar
          curl -sLo kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.22/kotlin-compiler-1.9.22.zip
          unzip -qo kotlinc.zip

      - name: Build Plugins to FLX
        run: |
          # রানারে থাকা প্রি-ইনস্টল্ড অ্যান্ড্রয়েড প্ল্যাটফর্ম এবং d8 পাথ
          ANDROID_JAR=$(ls -1 /usr/local/lib/android/sdk/platforms/android-*/android.jar | tail -n 1)
          D8_TOOL=$(ls -1 /usr/local/lib/android/sdk/build-tools/*/d8 | tail -n 1)

          echo "Using Android Jar: $ANDROID_JAR"
          echo "Using D8 Tool: $D8_TOOL"

          # কমন ইন্টারফেস
          mkdir -p src/com/flixora/plugin
          cat << 'EOF' > src/com/flixora/plugin/MainAPI.kt
          package com.flixora.plugin

          data class MovieItem(
              val title: String,
              val image: String,
              val url: String
          )

          abstract class MainAPI {
              abstract var name: String
              abstract var mainUrl: String
              abstract suspend fun getMainPage(): List<MovieItem>
              abstract suspend fun search(query: String): List<MovieItem>
          }
          EOF

          # কম্পাইল ও ডেক্সিং
          for file in plugins/*.kt; do
            if [ -f "$file" ]; then
              baseName=$(basename "$file" .kt)
              outputName=$(echo "$baseName" | sed 's/Provider$//')
              echo "===> Processing: $baseName.kt -> $outputName.flx"

              # ১. কটলিন কম্পাইল
              ./kotlinc/bin/kotlinc "$file" src/com/flixora/plugin/MainAPI.kt \
                -cp "jsoup.jar:$ANDROID_JAR" \
                -d "${outputName}_temp.jar"

              # ২. প্রি-ইনস্টল্ড D8 দিয়ে ডেক্স বাইনারি তৈরি
              mkdir -p "dex_out_${outputName}"
              $D8_TOOL --release --min-api 21 --lib "$ANDROID_JAR" --output "dex_out_${outputName}" "${outputName}_temp.jar" jsoup.jar

              # ৩. classes.dex ফাইলকে .flx হিসেবে মুভ করা
              mv "dex_out_${outputName}/classes.dex" "${outputName}.flx"
              rm -rf "dex_out_${outputName}" "${outputName}_temp.jar"
            fi
          done

          rm -rf src kotlinc kotlinc.zip jsoup.jar

      - name: Commit and Push FLX Binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.flx
          git diff --staged --quiet || (git commit -m "Auto-compiled plugins to .flx binaries" && git push)
